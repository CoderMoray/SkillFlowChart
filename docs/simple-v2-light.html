<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试 Skill 执行决策流程图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #2C2C2A;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; color: #2C2C2A; }
    .subtitle { font-size: 13px; color: #888780; margin-bottom: 16px; }
    svg { max-width: 760px; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>测试 Skill · AI 执行决策流程图</h1>
  <p class="subtitle"></p>
<svg viewBox="114.0 0 476.0 500.0" width="100%" role="img">
  <title>测试 Skill 执行决策流程图</title>
  <rect x="114.0" y="0" width="476.0" height="500.0" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #888780; }
    .th { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ths { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #2C2C2A; }
    .edge { fill: none; stroke: #888780; stroke-width: 1.2; }
    .edge-dash { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 3; }
  </style>
  <line class="edge" x1="340.0" y1="76.0" x2="340.0" y2="108.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="168.0" x2="340.0" y2="212.0"/>
  <line class="edge" x1="340.0" y1="212.0" x2="214.0" y2="212.0"/>
  <line class="edge" x1="214.0" y1="212.0" x2="214.0" y2="224.0" marker-end="url(#arrow)"/>
  <text class="ts" x="277.0" y="190.0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否</text>
  <line class="edge" x1="340.0" y1="168.0" x2="340.0" y2="212.0"/>
  <line class="edge" x1="340.0" y1="212.0" x2="440.0" y2="212.0"/>
  <line class="edge" x1="440.0" y1="212.0" x2="440.0" y2="224.0" marker-end="url(#arrow)"/>
  <text class="ts" x="390.0" y="190.0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">是</text>
  <line class="edge" x1="440.0" y1="268.0" x2="440.0" y2="284.0"/>
  <line class="edge" x1="440.0" y1="284.0" x2="340.0" y2="284.0"/>
  <line class="edge" x1="340.0" y1="284.0" x2="340.0" y2="300.0" marker-end="url(#arrow)"/>
  <rect x="230.0" y="32.0" width="220" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340.0" y="54.0" text-anchor="middle" dominant-baseline="central">用户调用</text>
  <polygon points="340.0,108.0 415.0,138.0 340.0,168.0 265.0,138.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="138.0" text-anchor="middle" dominant-baseline="central">OK?</text>
  <rect x="154.0" y="224.0" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="th" x="214.0" y="246.0" text-anchor="middle" dominant-baseline="central">退出</text>
  <rect x="330.0" y="224.0" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="440.0" y="246.0" text-anchor="middle" dominant-baseline="central">执行</text>
  <rect x="280.0" y="300.0" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="th" x="340.0" y="322.0" text-anchor="middle" dominant-baseline="central">结束</text>
  <line x1="154.0" y1="408.0" x2="550.0" y2="408.0" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="352.0" y="420.0" text-anchor="middle" dominant-baseline="central">图例</text>
  <rect x="149.0" y="432.0" width="94" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="196.0" y="444.0" text-anchor="middle" dominant-baseline="central">AI 执行</text>
  <rect x="255.0" y="432.0" width="94" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="302.0" y="444.0" text-anchor="middle" dominant-baseline="central">输出/报告</text>
  <rect x="361.0" y="432.0" width="66" height="24" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="394.0" y="444.0" text-anchor="middle" dominant-baseline="central">决策点</text>
  <rect x="439.0" y="432.0" width="52" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="465.0" y="444.0" text-anchor="middle" dominant-baseline="central">脚本</text>
  <rect x="503.0" y="432.0" width="52" height="24" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="ts" x="529.0" y="444.0" text-anchor="middle" dominant-baseline="central">终止</text>
</svg>
</body>
</html>
