<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillFlowChart 执行决策流程图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #2C2C2A;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; color: #2C2C2A; }
    .subtitle { font-size: 13px; color: #888780; margin-bottom: 16px; }
    svg { max-width: 760px; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>SkillFlowChart · AI 执行决策流程图</h1>
  <p class="subtitle">AI 提取语义，脚本计算几何</p>
<svg viewBox="90.0 0 500.0 892.0" width="100%" role="img">
  <title>SkillFlowChart 执行决策流程图</title>
  <rect x="90.0" y="0" width="500.0" height="892.0" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #888780; }
    .th { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ths { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #2C2C2A; }
    .edge { fill: none; stroke: #888780; stroke-width: 1.2; }
    .edge-dash { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 3; }
  </style>
  <line class="edge" x1="340.0" y1="76.0" x2="340.0" y2="108.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="164.0" x2="340.0" y2="196.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="256.0" x2="340.0" y2="300.0"/>
  <line class="edge" x1="340.0" y1="300.0" x2="240.0" y2="300.0"/>
  <line class="edge" x1="240.0" y1="300.0" x2="240.0" y2="312.0" marker-end="url(#arrow)"/>
  <text class="ts" x="290.0" y="278.0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">否</text>
  <line class="edge" x1="340.0" y1="444.0" x2="340.0" y2="476.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="536.0" x2="340.0" y2="583.0"/>
  <line class="edge" x1="340.0" y1="583.0" x2="214.0" y2="583.0"/>
  <line class="edge" x1="214.0" y1="583.0" x2="214.0" y2="598.0" marker-end="url(#arrow)"/>
  <text class="ts" x="277.0" y="561.0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">失败</text>
  <line class="edge" x1="340.0" y1="536.0" x2="340.0" y2="580.0"/>
  <line class="edge" x1="340.0" y1="580.0" x2="440.0" y2="580.0"/>
  <line class="edge" x1="440.0" y1="580.0" x2="440.0" y2="592.0" marker-end="url(#arrow)"/>
  <text class="ts" x="390.0" y="558.0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">通过</text>
  <line class="edge" x1="440.0" y1="648.0" x2="440.0" y2="664.0"/>
  <line class="edge" x1="440.0" y1="664.0" x2="340.0" y2="664.0"/>
  <line class="edge" x1="340.0" y1="664.0" x2="340.0" y2="680.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="256.0" x2="340.0" y2="384.0"/>
  <line class="edge" x1="240.0" y1="356.0" x2="240.0" y2="384.0"/>
  <line class="edge" x1="240.0" y1="384.0" x2="340.0" y2="384.0"/>
  <line class="edge" x1="340.0" y1="384.0" x2="340.0" y2="388.0" marker-end="url(#arrow)"/>
  <rect x="230.0" y="32.0" width="220" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340.0" y="54.0" text-anchor="middle" dominant-baseline="central">用户触发</text>
  <rect x="230.0" y="108.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340.0" y="129.0" text-anchor="middle" dominant-baseline="central">定位 SKILL.md</text>
  <text class="ts" x="340.0" y="146.0" text-anchor="middle" dominant-baseline="central" fill="#888780">查找路径 / 询问用户</text>
  <polygon points="340.0,196.0 415.0,226.0 340.0,256.0 265.0,226.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="226.0" text-anchor="middle" dominant-baseline="central">SKILL.md 存在？</text>
  <rect x="130.0" y="312.0" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="240.0" y="334.0" text-anchor="middle" dominant-baseline="central">询问路径</text>
  <rect x="230.0" y="388.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340.0" y="409.0" text-anchor="middle" dominant-baseline="central">AI 提取 nodes.json</text>
  <text class="ts" x="340.0" y="426.0" text-anchor="middle" dominant-baseline="central" fill="#888780">语义理解 → 结构化数据</text>
  <polygon points="340.0,476.0 415.0,506.0 340.0,536.0 265.0,506.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="506.0" text-anchor="middle" dominant-baseline="central">校验通过？</text>
  <rect x="154.0" y="598.0" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="th" x="214.0" y="620.0" text-anchor="middle" dominant-baseline="central">输出校验错误</text>
  <rect x="330.0" y="592.0" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ths" x="440.0" y="613.0" text-anchor="middle" dominant-baseline="central">脚本渲染 HTML</text>
  <text class="ts" x="440.0" y="630.0" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">坐标计算 + SVG + CSS</text>
  <rect x="230.0" y="680.0" width="220" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340.0" y="701.0" text-anchor="middle" dominant-baseline="central">输出流程图</text>
  <text class="ts" x="340.0" y="718.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">自包含 HTML · 零依赖</text>
  <line x1="130.0" y1="800.0" x2="550.0" y2="800.0" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="340.0" y="812.0" text-anchor="middle" dominant-baseline="central">图例</text>
  <rect x="137.0" y="824.0" width="94" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="184.0" y="836.0" text-anchor="middle" dominant-baseline="central">AI 执行</text>
  <rect x="243.0" y="824.0" width="94" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="290.0" y="836.0" text-anchor="middle" dominant-baseline="central">输出/报告</text>
  <rect x="349.0" y="824.0" width="66" height="24" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="382.0" y="836.0" text-anchor="middle" dominant-baseline="central">决策点</text>
  <rect x="427.0" y="824.0" width="52" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="453.0" y="836.0" text-anchor="middle" dominant-baseline="central">脚本</text>
  <rect x="491.0" y="824.0" width="52" height="24" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="ts" x="517.0" y="836.0" text-anchor="middle" dominant-baseline="central">终止</text>
</svg>
</body>
</html>
