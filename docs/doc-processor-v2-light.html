<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>文档处理器 执行决策流程图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #2C2C2A;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; color: #2C2C2A; }
    .subtitle { font-size: 13px; color: #888780; margin-bottom: 16px; }
    svg { max-width: 760px; width: 100%; height: auto; }
  </style>
</head>
<body>

  <rect x="515.0" y="484.0" width="52" height="24" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
