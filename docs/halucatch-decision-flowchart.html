<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HaluCatch 执行决策流程图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #2C2C2A;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #888780; margin-bottom: 32px; }
    svg { max-width: 760px; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>HaluCatch · AI 执行决策流程图</h1>
  <p class="subtitle">从用户调用到报告落盘的完整决策树</p>
<svg viewBox="-60.0 0 776.0 774.0" width="100%" role="img">
  <title>HaluCatch 执行决策流程图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t { font-family: system-ui, sans-serif; font-size: 14px; fill: #2C2C2A; }
    .ts { font-family: system-ui, sans-serif; font-size: 12px; fill: #5F5E5A; }
    .th { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ths { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #2C2C2A; }
    .edge { fill: none; stroke: #888780; stroke-width: 1.2; }
    .edge-dash { fill: none; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 3; }
  </style>
  <line class="edge" x1="340.0" y1="76.0" x2="340.0" y2="102.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="265.0" y1="132.0" x2="150.0" y2="132.0" marker-end="url(#arrow)"/>
  <text class="ts" x="207.5" y="124.0" text-anchor="middle">否</text>
  <line class="edge" x1="340.0" y1="162.0" x2="340.0" y2="188.0" marker-end="url(#arrow)"/>
  <text class="ts" x="340.0" y="169.0" text-anchor="middle">是</text>
  <line class="edge" x1="415.0" y1="218.0" x2="456.0" y2="218.0" marker-end="url(#arrow)"/>
  <text class="ts" x="435.5" y="210.0" text-anchor="middle">val</text>
  <line class="edge" x1="566.0" y1="246.0" x2="566.0" y2="280.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="248.0" x2="340.0" y2="274.0" marker-end="url(#arrow)"/>
  <text class="ts" x="340.0" y="255.0" text-anchor="middle">非val</text>
  <line class="edge" x1="230.0" y1="330.0" x2="300.0" y2="356.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="450.0" y1="330.0" x2="380.0" y2="356.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="494.0" x2="340.0" y2="520.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="340.0" y1="576.0" x2="340.0" y2="602.0" marker-end="url(#arrow)"/>
  <line class="edge" x1="265.0" y1="632.0" x2="200.0" y2="632.0" marker-end="url(#arrow)"/>
  <text class="ts" x="232.5" y="624.0" text-anchor="middle">修</text>
  <line class="edge" x1="415.0" y1="632.0" x2="506.0" y2="632.0" marker-end="url(#arrow)"/>
  <text class="ts" x="460.5" y="624.0" text-anchor="middle">不修</text>
  <line class="edge" x1="190.0" y1="412.0" x2="190.0" y2="418.0"/>
  <line class="edge" x1="490.0" y1="412.0" x2="490.0" y2="418.0"/>
  <line class="edge" x1="190.0" y1="418.0" x2="490.0" y2="418.0"/>
  <line class="edge" x1="340.0" y1="418.0" x2="340.0" y2="438.0" marker-end="url(#arrow)"/>
  <rect x="230.0" y="32.0" width="220" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340.0" y="54.0" text-anchor="middle" dominant-baseline="central">用户调用 HaluCatch</text>
  <polygon points="340.0,102.0 415.0,132.0 340.0,162.0 265.0,132.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>

  <rect x="30.0" y="110.0" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>

  <polygon points="340.0,188.0 415.0,218.0 340.0,248.0 265.0,218.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="218.0" text-anchor="middle" dominant-baseline="central">模式?</text>
  <rect x="456.0" y="190.0" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ths" x="566.0" y="211.0" text-anchor="middle" dominant-baseline="central">L1 脚本扫描</text>
  <text class="ts" x="566.0" y="228.0" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">--validate</text>
  <rect x="506.0" y="280.0" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="th" x="566.0" y="302.0" text-anchor="middle" dominant-baseline="central">结束</text>
  <rect x="230.0" y="274.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340.0" y="295.0" text-anchor="middle" dominant-baseline="central">Phase 0: 技能分类</text>
  <text class="ts" x="340.0" y="312.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">含 .py / .xlsx / pd.read_ ?</text>
  <rect x="80.0" y="356.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="190.0" y="377.0" text-anchor="middle" dominant-baseline="central">数据驱动型</text>
  <text class="ts" x="190.0" y="394.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L2+L3 四维评估</text>
  <rect x="380.0" y="356.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="490.0" y="377.0" text-anchor="middle" dominant-baseline="central">纯方法论型</text>
  <text class="ts" x="490.0" y="394.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">L3 方法论评估</text>
  <rect x="230.0" y="438.0" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340.0" y="459.0" text-anchor="middle" dominant-baseline="central">L2 脚本基线 + L3 AI 补充</text>
  <text class="ts" x="340.0" y="476.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">地基 · 代码 · 规则 · 护栏</text>
  <rect x="230.0" y="520.0" width="220" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340.0" y="541.0" text-anchor="middle" dominant-baseline="central">Phase 3: 三版报告生成</text>
  <text class="ts" x="340.0" y="558.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">专业版 / 通俗版 / AI 行动版 → 落盘</text>
  <polygon points="340.0,602.0 415.0,632.0 340.0,662.0 265.0,632.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ths" x="340.0" y="632.0" text-anchor="middle" dominant-baseline="central">修复?</text>
  <rect x="-20.0" y="610.0" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ths" x="90.0" y="632.0" text-anchor="middle" dominant-baseline="central">生成修复方案</text>
  <rect x="506.0" y="610.0" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="th" x="566.0" y="632.0" text-anchor="middle" dominant-baseline="central">结束</text>
  <rect x="177.0" y="702.0" width="16" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="197.0" y="708.0" dominant-baseline="central">AI 执行</text>
  <rect x="287.0" y="702.0" width="16" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="307.0" y="708.0" dominant-baseline="central">输出/报告</text>
  <rect x="397.0" y="702.0" width="16" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="417.0" y="708.0" dominant-baseline="central">决策点</text>
  <rect x="479.0" y="702.0" width="16" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="499.0" y="708.0" dominant-baseline="central">脚本</text>
  <rect x="547.0" y="702.0" width="16" height="12" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="ts" x="567.0" y="708.0" dominant-baseline="central">终止</text>
</svg>
</body>
</html>
